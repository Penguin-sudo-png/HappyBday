<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Letter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>

    <div class="decor decor-left" aria-hidden="true">
      <div class="photo-slot photo-slot-one"></div>
      <div class="photo-slot photo-slot-two"></div>
    </div>
    <div class="decor decor-right" aria-hidden="true">
      <div class="photo-slot photo-slot-three"></div>
      <div class="photo-slot photo-slot-four"></div>
    </div>

    <div class="scene">
      <div
        class="envelope-wrap"
        id="envelopeWrap"
        aria-label="Open birthday envelope"
        tabindex="0"
        role="button"
      >
        <div class="envelope">
          <div class="flap"></div>
          <div class="seal"></div>
        </div>

        <div class="letter">
          <div class="letter-inner">
            <div class="letter-head">
              <span>For You</span>
              <span>✨</span>
            </div>
            <div class="letter-title">Happy Birthday</div>
            <textarea aria-label="Birthday message" placeholder="happy birthday, my love! ♡

To my favorite person in the entire world,

Happy birthday, honey! Today is all about you, and I hope you know just how special this day is, not only because it's the day you were born, but because the world became a little more beautiful when you came into it. I'm so grateful that you exist, that I got the chance to know you, and that somewhere along the way, I got to love someone as wonderful as you. If I could give you anything today, it would be the ability to see yourself through my eyes, even just for a moment, so you could understand why I appreciate you as much as I do.

If our love were a song, I think it would be Bulletproof Love. Not because I believe we'll never encounter difficulties, but because even when things get hard, I want to keep choosing you. I want to learn how to love you better, understand you more, and remind you that you're someone worth celebrating every single day. And as we grow older, I hope we can always remember Hold On Till May, a little reminder that even when life gets difficult, there are still beautiful days ahead of us waiting to be experienced.

Honey, I hope you never feel like you have to be perfect to deserve love. Just like I Don't Care If You're Contagious, I want to love you through your imperfect moments, your tired days, your worries, and everything else that makes you human. You don't always have to be happy or strong around me. You can simply be yourself, and I'll still find a thousand reasons to adore you. To me, you're Floral & Fading, beautiful even on the days when you don't feel like you're blooming. I hope this new chapter of your life reminds you of how much you deserve happiness, peace, success, and all the little things that make your heart feel full.

And if there's one thing I hope to be for you, it's your Emergency Contact—someone you can turn to when life feels overwhelming, someone who listens when you need to talk, and someone who celebrates your victories as if they're my own. Even Even When I'm Not with You, I hope you always feel the love I have for you, whether we're spending time together or taking care of our own responsibilities. I want our love to be something that comforts you, not something that makes you feel like you have to sacrifice every other part of your life.

Of course, I still want all our little Besitos, our random moments of affection, our silly conversations, and those memories that might seem ordinary to everyone else but mean the world to me. I want more birthdays with you, more celebrations, more laughter, more pictures, more late-night conversations, and more opportunities to make you feel special.

I know we won't always get everything right. Sometimes, our disagreements might turn into our own little Disasterology, and we might struggle to understand each other. But I hope this new year of your life brings us more patience, understanding, and maturity. I want to become someone who doesn't just tell you that I love you but shows you through the way I treat you, listen to you, and make room for your feelings.

Because, baby, not even Million Dollar Houses (The Painter) could capture the kind of happiness I feel knowing that you're here, living your life and becoming the person you're meant to be. You don't have to achieve anything extraordinary to deserve to be celebrated. You deserve it simply because you're you.

So today, please enjoy your birthday. Eat your favorite food, laugh as much as you can, take lots of pictures, make beautiful memories, and allow yourself to be spoiled with love. I hope this next chapter brings you closer to your dreams, surrounds you with people who genuinely care about you, and gives you countless reasons to smile.

Happy birthday again, my honey. Thank you for being born, for being the person you are, and for allowing me to be part of your life. If there's one thing I hope you carry with you into this new age, it's the reminder that you are loved, appreciated, and deserving of beautiful things. I hope I get to celebrate many more birthdays with you, watching you grow, cheering for your achievements, and loving you through every version of yourself.

I love you so much, birthday girl. Here's to you, your dreams, your happiness, and all the beautiful unopened pages waiting for you. May this year be kind to you, and may you never forget how precious you are to me.

Happy birthday, my love. I love you always. ♡"></textarea>
          </div>
        </div>
      </div>
      <div class="note">click to open</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
